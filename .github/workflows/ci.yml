name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookshelf
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: bookshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookshelf -d bookshelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://bookshelf:ci_password@127.0.0.1:5432/bookshelf_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Apply database schema
        run: psql "$TEST_DATABASE_URL" -f ../db/schema.sql

      - name: Run tests
        run: npm test